# Added 2026-09-24 for the idle-freeze investigation.
# If the kernel detects a lockup, panic -> kdump saves a dump to /var/crash.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.nmi_watchdog = 1
# Reboot 10 s after a panic instead of hanging forever (headless box).
kernel.panic = 10
